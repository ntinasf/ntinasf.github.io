navbar-links:
  Home: "/"
  Projects: "projects"
  
url: "https://ntinasf.github.io"
baseurl: ""

social-network-links:
  github: ntinasf
  linkedin: fotios-ntinas

author: Ntinas Fotios
avatar: "/assets/images/profile_pic.png"

